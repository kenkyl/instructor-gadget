name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Same images as docker-compose, so integration tests run against the real stores.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: instructor
          POSTGRES_PASSWORD: instructor
          POSTGRES_DB: instructor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U instructor -d instructor"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: OpenAPI types are up to date
        run: |
          uv run python -m app.export_openapi > ../web/openapi.json
          git diff --exit-code -- ../web/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
