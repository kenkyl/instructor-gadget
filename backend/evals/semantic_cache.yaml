# Semantic cache eval (PC3.2): labelled lesson-request pairs for the threshold sweep.
#
# Each pair: `stored` is a lesson already in the cache, `request` is a new lesson request.
# Texts use the real embedded shape (data-model §6.4): "{topic}\n{concept title}\n{mastery statement}".
# `label` is decided by meaning, not by measured distance:
#   hit:  the stored lesson teaches what the request asks for (serving it is correct)
#   miss: serving it would teach the wrong concept (a false hit)
# `request_bucket` overrides bucket fields for the request only (ADR-0007): those pairs check
# that the bucket, not the threshold, separates them.
# `source: dev-db` texts were generated by map-concepts for real courses (three near-duplicate
# pooling courses, plus caching and data-structure courses); `synthetic` ones are written by hand
# (the brief's near-misses).

pairs:
  # --- should hit: the same concept, worded differently -----------------------------------------
  - id: pool-diagnose
    label: hit
    source: dev-db
    stored: |-
      Database connection pooling for web application
      Diagnosing pool exhaustion
      You can diagnose pool exhaustion from metrics and symptoms and decide whether the cause is a leak, long-held connections, or an undersized pool.
    request: |-
      Connection pooling for databases from backends
      Diagnosing pool exhaustion
      You can diagnose pool exhaustion from symptoms (acquire timeouts, rising wait queue, server connection counts) and decide whether the cause is a leak, slow queries or undersizing.

  - id: pool-settings
    label: hit
    source: dev-db
    stored: |-
      Database connection pooling for backend services
      Core pool settings
      You can configure a pool in code with min/max size, acquire timeout, idle timeout and max lifetime, and predict the behavior each setting produces.
    request: |-
      Database connection pooling for web application
      Core pool settings
      You can configure min/max size, idle timeout, max lifetime, and acquire timeout in a pool and state what each setting controls.

  - id: max-connections
    label: hit
    source: dev-db
    stored: |-
      Database connection pooling for backend services
      Server max_connections and per-instance pools
      You can calculate the total connections a fleet of service instances can open and compare it to the database's max_connections, including reserved headroom.
    request: |-
      Connection pooling for databases from backends
      Server max_connections and per-instance pools
      You can calculate the total connections a fleet of backend instances can open and compare it with the database server's max_connections.

  - id: connection-budget
    label: hit
    source: dev-db
    stored: |-
      Connection pooling for databases from backends
      Server max_connections and per-instance pools
      You can calculate the total connections a fleet of backend instances can open and compare it with the database server's max_connections.
    request: |-
      Database connection pooling for web application
      Connection budget across instances
      You can divide a database's max connection limit across multiple app instances, workers, and admin needs, including during autoscaling and deploys.

  - id: connection-cost
    label: hit
    source: dev-db
    stored: |-
      Database connection pooling for backend services
      Why connections are expensive
      You can explain where the cost of opening a database connection lands (TCP, TLS, auth, server process/memory) and estimate the latency saved by reusing one.
    request: |-
      Connection pooling for databases from backends
      Cost of a connection per request
      You can explain which steps (TCP, TLS, auth, server process setup) make opening a database connection per request costly and estimate the latency a pool amortizes.

  - id: per-request-cost
    label: hit
    source: dev-db
    stored: |-
      Database connections for app backend
      Cost of per-request connections
      You can estimate the latency and server overhead of opening a new connection for every request and identify why it fails under load.
    request: |-
      Connection pooling for databases from backends
      Cost of a connection per request
      You can explain which steps (TCP, TLS, auth, server process setup) make opening a database connection per request costly and estimate the latency a pool amortizes.

  - id: pool-lifecycle
    label: hit
    source: dev-db
    stored: |-
      Database connection pooling for backend services
      Pool lifecycle: borrow, use, return
      You can trace a connection through a pool's lifecycle (create, borrow, return, validate, evict) and state what happens at each step.
    request: |-
      Connection pooling for databases from backends
      Pool lifecycle: acquire, use, release
      You can trace a connection through a pool's lifecycle (create, idle, checked out, returned, closed) and write code that acquires and releases correctly.

  - id: how-pool-works
    label: hit
    source: dev-db
    stored: |-
      Database connection pooling for web application
      How a pool works
      You can trace the lifecycle of a connection through a pool (create, borrow, return, reuse, evict) and explain how this amortizes setup cost.
    request: |-
      Database connections for app backend
      How connection pooling works
      You can describe how a pool borrows, reuses and returns connections, and configure a basic pool in a client library.

  - id: release-discipline
    label: hit
    source: dev-db
    stored: |-
      Database connection pooling for backend services
      Releasing connections correctly
      You can write request-handling code that always returns connections to the pool, including on errors, and spot code paths that leak them.
    request: |-
      Database connection pooling for web application
      Borrowing and returning correctly
      You can write request-handling code that always releases its connection, including on errors, and identify code paths that leak connections.

  - id: external-poolers
    label: hit
    source: dev-db
    stored: |-
      Database connection pooling for web application
      Tradeoffs and external poolers
      You can evaluate in-app pooling versus an external pooler for a given deployment and explain the tradeoffs to a colleague.
    request: |-
      Database connections for app backend
      Poolers, scaling and tradeoffs
      You can evaluate whether to use in-app pools, an external pooler or serverless-friendly proxies for a given deployment, and explain the tradeoffs to a colleague.

  - id: k8s-pods
    label: hit
    source: synthetic
    note: the brief's example ("Intro to Kubernetes pods" / "Kubernetes pod basics")
    stored: |-
      Kubernetes fundamentals
      Intro to Kubernetes pods
      You can explain what a pod is, why its containers share a network namespace, and when two containers belong in one pod.
    request: |-
      Getting started with Kubernetes
      Kubernetes pod basics
      You can describe what a pod is, how its containers share networking and storage, and decide when containers should run in the same pod.

  - id: stampede-mitigation
    label: hit
    source: synthetic
    stored: |-
      Redis caching patterns
      Containing stampedes
      You can implement a lock or single-flight with SET NX, and apply TTL jitter or early refresh to prevent a stampede.
    request: |-
      Caching with Redis in production
      Preventing cache stampedes
      You can prevent a thundering herd on a hot key with a lock or request coalescing, TTL jitter, or early refresh.

